// 顶层 build 文件（buildscript 方式更稳定）
buildscript {
    repositories {
        // 国内镜像优先：阿里云 → 腾讯云 → 华为云
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/public' }
        maven { url 'https://repo.huaweicloud.com/repository/maven' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // AGP 8.7.0 匹配 Gradle 8.14（系统 Gradle 为 8.14.4）
        classpath 'com.android.tools.build:gradle:8.7.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:1.9.24'
    }
}

plugins {
    // 留空，所有插件通过 buildscript + apply 引入
}
